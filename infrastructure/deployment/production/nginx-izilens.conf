# /etc/nginx/sites-available/izilens-api.conf - terminaison TLS et proxy vers uvicorn (127.0.0.1:8000)
limit_req_zone $binary_remote_addr zone=izilens_api:10m rate=20r/s;

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    # Plafond cohérent avec MAX_REQUEST_MB (recto + verso + champs)
    client_max_body_size 20m;
    client_body_timeout 30s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        limit_req zone=izilens_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_request_buffering on;
    }

    # Documentation interactive : à restreindre ou désactiver (DOCS_ENABLED=false) en production
    location = /docs { deny all; }
    location = /openapi.json { deny all; }
}
