    <circle cx="140" cy="264" r="14" stroke="#22c7f2" stroke-width="4"/><circle cx="140" cy="264" r="5" fill="#22c7f2"/>
    <rect x="30" y="322" width="220" height="10" rx="5" fill="#2f6aa8"/>

    <!-- terminal -->
