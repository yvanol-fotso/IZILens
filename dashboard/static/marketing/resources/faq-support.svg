<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" fill="none" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b2447"/><stop offset="1" stop-color="#14508a"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".6" r=".55"><stop offset="0" stop-color="#3ddc97" stop-opacity=".25"/><stop offset="1" stop-color="#3ddc97" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#fff" stroke-opacity=".05"/></pattern>
    <clipPath id="c"><rect width="640" height="560" rx="32"/></clipPath>
    <g id="b">
      <path d="M-110 230C-110 124-62 72 0 72S110 124 110 230Z" fill="var(--top)"/>
      <rect x="-14" y="30" width="28" height="48" fill="var(--skin)"/>
      <path d="M-28 72Q0 108 28 72Z" fill="var(--skin)"/>
      <circle cx="-41" cy="6" r="8" fill="var(--skin)"/><circle cx="41" cy="6" r="8" fill="var(--skin)"/>
      <ellipse rx="40" ry="46" fill="var(--skin)"/>
      <circle cx="-14" cy="-2" r="3.5" fill="#1d1410"/><circle cx="14" cy="-2" r="3.5" fill="#1d1410"/>
      <path d="M-12 22Q0 32 12 22" stroke="#1d1410" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>
  <g clip-path="url(#c)">
    <rect width="640" height="560" fill="url(#bg)"/>
    <rect width="640" height="560" fill="url(#grid)"/>
    <rect width="640" height="560" fill="url(#glow)"/>

    <!-- bulles -->
    <g transform="translate(40 80)">
      <path d="M46 80l-14 26 38-26z" fill="#12335f"/>
