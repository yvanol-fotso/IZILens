      <text x="56" y="64" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="800" fill="#22c7f2">?</text>
      <rect x="96" y="30" width="80" height="9" rx="4.5" fill="#fff" fill-opacity=".28"/><rect x="96" y="48" width="56" height="9" rx="4.5" fill="#fff" fill-opacity=".16"/>
    </g>
    <g transform="translate(410 130)">
      <path d="M150 66l14 26-38-26z" fill="#3ddc97"/>
      <rect width="190" height="72" rx="24" fill="#3ddc97"/>
      <circle cx="38" cy="36" r="16" fill="#032a1d"/><path d="M30 36l6 6 11-13" stroke="#3ddc97" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="66" y="26" width="96" height="9" rx="4.5" fill="#032a1d" fill-opacity=".7"/><rect x="66" y="42" width="64" height="9" rx="4.5" fill="#032a1d" fill-opacity=".4"/>
    </g>
    <g transform="translate(40 250)">
      <rect width="112" height="48" rx="24" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".16"/>
      <circle cx="34" cy="24" r="5" fill="#22c7f2"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="56" cy="24" r="5" fill="#22c7f2"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" begin=".2s" repeatCount="indefinite"/></circle>
      <circle cx="78" cy="24" r="5" fill="#22c7f2"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" begin=".4s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="translate(468 316)">
      <rect width="132" height="48" rx="24" fill="#22c7f2" fill-opacity=".18" stroke="#22c7f2" stroke-opacity=".6"/>
      <circle cx="26" cy="24" r="8" fill="#22c7f2"/><rect x="44" y="20" width="68" height="8" rx="4" fill="#fff" fill-opacity=".5"/>
    </g>

    <!-- conseiller avec casque -->
    <g transform="translate(320 352) scale(1.25)">
      <use href="#b" style="--skin:#6b4226;--top:#ffb84d"/>
      <path d="M-42-8C-46-50 46-50 42-8C30-30-30-30-42-8Z" fill="#1d1410"/>
      <path d="M-47 0C-52-62 52-62 47 0" stroke="#22c7f2" stroke-width="7" stroke-linecap="round"/>
      <rect x="-56" y="-6" width="14" height="30" rx="7" fill="#22c7f2"/><rect x="42" y="-6" width="14" height="30" rx="7" fill="#22c7f2"/>
      <path d="M50 22Q52 50 18 44" stroke="#22c7f2" stroke-width="4" stroke-linecap="round"/><circle cx="16" cy="44" r="6" fill="#22c7f2"/>
    </g>
