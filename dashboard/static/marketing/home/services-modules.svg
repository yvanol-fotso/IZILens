    <circle cx="46" cy="48" r="26" fill="#22c7f2" fill-opacity=".16"/>
    <g stroke="#22c7f2" stroke-width="3" stroke-linecap="round" fill="none"><circle cx="46" cy="41" r="7"/><path d="M33 62c0-8 6-13 13-13s13 5 13 13"/></g>
    <text x="88" y="57" fill="#fff" font-size="26" font-weight="800">KYC</text>
  </g>
  <!-- KYB -->
  <g transform="translate(110 222)">
    <rect width="230" height="96" rx="22" fill="#12335f" stroke="#7c8cff" stroke-opacity=".6"/>
    <circle cx="46" cy="48" r="26" fill="#7c8cff" fill-opacity=".16"/>
    <g stroke="#7c8cff" stroke-width="3" stroke-linecap="round" fill="none"><rect x="36" y="34" width="20" height="28" rx="2"/><path d="M42 43h8M42 51h8"/></g>
    <text x="88" y="57" fill="#fff" font-size="26" font-weight="800">KYB</text>
  </g>
