    <rect width="230" height="96" rx="22" fill="#12335f" stroke="#3ddc97" stroke-opacity=".6"/>
    <circle cx="46" cy="48" r="26" fill="#3ddc97" fill-opacity=".16"/>
    <g stroke="#3ddc97" stroke-width="3" stroke-linecap="round" fill="none"><path d="M33 58c0-8 6-15 13-15s13 7 13 15"/><path d="M39 62c0-6 3-12 7-12s7 6 7 12"/><path d="M46 56v6"/></g>
