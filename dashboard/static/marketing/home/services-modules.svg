<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" fill="none" font-family="Inter, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b2447"/><stop offset="1" stop-color="#103d70"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#22c7f2" stop-opacity=".35"/><stop offset="1" stop-color="#22c7f2" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#fff" stroke-opacity=".05"/></pattern>
  </defs>
  <rect width="1200" height="380" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="28" fill="url(#grid)"/>
  <circle cx="600" cy="190" r="190" fill="url(#glow)"/>

  <!-- liaisons animées -->
  <g stroke-width="2.5" stroke-dasharray="7 9" stroke-linecap="round">
    <path d="M530 190C440 190 440 110 340 110" stroke="#22c7f2"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.6s" repeatCount="indefinite"/></path>
    <path d="M530 190C440 190 440 270 340 270" stroke="#7c8cff"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.6s" repeatCount="indefinite"/></path>
    <path d="M670 190C760 190 760 110 860 110" stroke="#3ddc97"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.6s" repeatCount="indefinite"/></path>
    <path d="M670 190C760 190 760 270 860 270" stroke="#ffb84d"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.6s" repeatCount="indefinite"/></path>
  </g>

  <!-- noyau IZI LENS -->
  <circle cx="600" cy="190" r="96" stroke="#22c7f2" stroke-opacity=".35" stroke-dasharray="3 12" stroke-width="2" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 600 190" to="360 600 190" dur="40s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="190" r="70" fill="#0e2a52" stroke="#22c7f2" stroke-width="2.5"/>
  <circle cx="600" cy="190" r="34" stroke="#22c7f2" stroke-width="6"/>
  <circle cx="600" cy="190" r="13" fill="#22c7f2"/>
  <circle cx="591" cy="181" r="4" fill="#fff" fill-opacity=".85"/>

  <!-- KYC -->
