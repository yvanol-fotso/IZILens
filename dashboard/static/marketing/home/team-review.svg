      <circle cx="224" cy="290" r="10" fill="#1b4577"/><rect x="244" y="286" width="120" height="8" rx="4" fill="#fff" fill-opacity=".25"/><rect x="376" y="282" width="56" height="16" rx="8" fill="#3ddc97" fill-opacity=".3"/>
    </g>
    <circle cx="420" cy="172" r="5" fill="#22c7f2"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></circle>

