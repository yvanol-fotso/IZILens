    <g transform="translate(70 396)"><rect width="34" height="34" rx="6" fill="#f2f6fc"/><path d="M34 8h8a6 6 0 0 1 0 14h-8" stroke="#f2f6fc" stroke-width="4"/><rect x="2" y="2" width="30" height="8" rx="4" fill="#ffb84d"/></g>
