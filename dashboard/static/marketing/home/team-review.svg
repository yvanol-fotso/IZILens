    <radialGradient id="glow" cx=".5" cy=".35" r=".6"><stop offset="0" stop-color="#22c7f2" stop-opacity=".35"/><stop offset="1" stop-color="#22c7f2" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#fff" stroke-opacity=".05"/></pattern>
