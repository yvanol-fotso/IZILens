<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" fill="none" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b2447"/><stop offset="1" stop-color="#14508a"/></linearGradient>
    <radialGradient id="glow" cx=".75" cy=".3" r=".6"><stop offset="0" stop-color="#22c7f2" stop-opacity=".35"/><stop offset="1" stop-color="#22c7f2" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#fff" stroke-opacity=".05"/></pattern>
    <clipPath id="c"><rect width="640" height="560" rx="32"/></clipPath>
    <g id="b">
      <path d="M-110 230C-110 124-62 72 0 72S110 124 110 230Z" fill="var(--top)"/>
      <rect x="-14" y="30" width="28" height="48" fill="var(--skin)"/>
      <path d="M-28 72Q0 108 28 72Z" fill="var(--skin)"/>
      <circle cx="-41" cy="6" r="8" fill="var(--skin)"/><circle cx="41" cy="6" r="8" fill="var(--skin)"/>
      <ellipse rx="40" ry="46" fill="var(--skin)"/>
      <circle cx="-14" cy="-2" r="3.5" fill="#1d1410"/><circle cx="14" cy="-2" r="3.5" fill="#1d1410"/>
      <path d="M-12 22Q0 32 12 22" stroke="#1d1410" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>
  <g clip-path="url(#c)">
    <rect width="640" height="560" fill="url(#bg)"/>
    <rect width="640" height="560" fill="url(#grid)"/>
    <rect width="640" height="560" fill="url(#glow)"/>

    <!-- développeur -->
    <g transform="translate(176 262) scale(1.05)">
      <use href="#b" style="--skin:#8d5a3b;--top:#7c8cff"/>
      <path d="M-42-8C-46-50 46-50 42-8C30-30-30-30-42-8Z" fill="#1d1410"/>
      <g stroke="#f2f6fc" stroke-width="3"><circle cx="-14" cy="-2" r="11"/><circle cx="14" cy="-2" r="11"/><path d="M-3-2h6"/></g>
    </g>
    <!-- ordinateur portable (vu de dos) -->
    <rect x="86" y="356" width="180" height="116" rx="12" fill="#0f2d58" stroke="#2f6aa8" stroke-width="3"/>
    <circle cx="176" cy="414" r="14" stroke="#22c7f2" stroke-width="4"/><circle cx="176" cy="414" r="5" fill="#22c7f2"/>
    <rect x="66" y="472" width="220" height="10" rx="5" fill="#2f6aa8"/>

    <!-- fenêtre de code -->
    <g transform="translate(326 108)">
      <rect width="284" height="300" rx="18" fill="#0f2d58" stroke="#fff" stroke-opacity=".16"/>
      <path d="M0 18a18 18 0 0 1 18-18h248a18 18 0 0 1 18 18v22H0z" fill="#12335f"/>
      <circle cx="24" cy="20" r="5" fill="#ff6b6b"/><circle cx="42" cy="20" r="5" fill="#ffc14d"/><circle cx="60" cy="20" r="5" fill="#3ddc97"/>
      <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">
        <text x="20" y="76" fill="#22c7f2" font-weight="700">POST</text><text x="60" y="76" fill="#cfe0f5">/v1/kyc/verifications</text>
        <text x="20" y="108" fill="#9db8d9">{ "reference": "ORDER-1042",</text>
        <text x="20" y="128" fill="#9db8d9">  "document_type": "national_id" }</text>
        <text x="20" y="170" fill="#3ddc97" font-weight="700">→ 201 Created</text>
        <text x="20" y="202" fill="#9db8d9">{ "id": "ver_8f2c…",</text>
        <text x="20" y="222" fill="#9db8d9">  "status": "processing" }</text>
      </g>
      <rect x="20" y="248" width="116" height="30" rx="15" fill="#3ddc97" fill-opacity=".2"/>
      <circle cx="40" cy="263" r="6" fill="#3ddc97"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <rect x="54" y="259" width="68" height="8" rx="4" fill="#3ddc97"/>
    </g>

    <!-- flux entre le portable et l'API -->
    <path d="M286 400C320 400 300 300 326 300" stroke="#22c7f2" stroke-width="2.5" stroke-dasharray="6 9" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-30" dur="1.4s" repeatCount="indefinite"/></path>

    <!-- webhook -->
    <g transform="translate(430 440)">
      <rect width="180" height="44" rx="22" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".16"/>
      <path d="M26 22h10l5-9 8 18 5-9h8" stroke="#ffb84d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="86" y="18" width="72" height="8" rx="4" fill="#fff" fill-opacity=".5"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
